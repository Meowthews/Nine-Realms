<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nine Realms splash portal.">
  <title>Nine Realms - Portal</title>
  <style>
    :root {
      color-scheme: dark;
      --gold: #f3d68a;
      --gold-deep: #b8842b;
      --jade: #7bd8c4;
      --mist: #dff8ff;
      --ink: #07151b;
      --paper: #fff6dc;
      --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
      --body: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--ink);
      color: var(--paper);
      font-family: var(--body);
    }

    body {
      min-height: 100vh;
    }

    .portal {
      --scene-x: 0px;
      --scene-y: 0px;
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      isolation: isolate;
      overflow: hidden;
    }

    .portal::before,
    .portal::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    .portal::before {
      background:
        radial-gradient(circle at 28% 20%, rgba(255, 226, 157, 0.26), transparent 23rem),
        radial-gradient(circle at 68% 66%, rgba(84, 224, 229, 0.16), transparent 20rem),
        linear-gradient(180deg, rgba(4, 14, 18, 0.16), rgba(4, 14, 18, 0.22) 48%, rgba(4, 14, 18, 0.64)),
        linear-gradient(90deg, rgba(4, 14, 18, 0.54), transparent 38%, transparent 62%, rgba(4, 14, 18, 0.48));
    }

    .portal::after {
      box-shadow: inset 0 0 9rem rgba(0, 0, 0, 0.62);
    }

    .language-switch {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 4;
      display: flex;
      gap: 0.35rem;
      padding: 0.32rem;
      border: 1px solid rgba(243, 214, 138, 0.34);
      background:
        linear-gradient(135deg, rgba(5, 22, 25, 0.68), rgba(5, 22, 25, 0.36)),
        rgba(5, 22, 25, 0.52);
      box-shadow:
        0 14px 32px rgba(0, 0, 0, 0.26),
        inset 0 0 0 1px rgba(255, 246, 220, 0.06);
      backdrop-filter: blur(12px);
    }

    .language-switch button {
      position: relative;
      min-width: 2.9rem;
      min-height: 2.25rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(243, 214, 138, 0.22);
      color: rgba(255, 246, 220, 0.78);
      background: rgba(255, 246, 220, 0.06);
      font: 800 0.78rem var(--body);
      letter-spacing: 0;
      cursor: pointer;
      transition: transform 180ms ease, color 180ms ease, border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
    }

    .language-switch button::after {
      content: "";
      position: absolute;
      left: 0.45rem;
      right: 0.45rem;
      bottom: 0.38rem;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(243, 214, 138, 0.86), transparent);
      transform: scaleX(0);
      transition: transform 180ms ease;
    }

    .language-switch button:hover,
    .language-switch button:focus-visible,
    .language-switch button.active {
      outline: none;
      transform: translateY(-1px);
      border-color: rgba(243, 214, 138, 0.62);
      color: var(--paper);
      background: rgba(243, 214, 138, 0.14);
      box-shadow: 0 0 18px rgba(123, 216, 196, 0.16);
    }

    .language-switch button:hover::after,
    .language-switch button:focus-visible::after,
    .language-switch button.active::after {
      transform: scaleX(1);
    }

    .scene {
      position: absolute;
      inset: -3vh -3vw;
      z-index: -3;
      overflow: hidden;
      isolation: isolate;
    }

    .scene img,
    .layer,
    .birds,
    .motes,
    .foreground-clouds,
    .drift-clouds {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .base {
      z-index: 0;
      object-fit: cover;
      object-position: center;
      transform: translate3d(calc(var(--scene-x) * -0.22), calc(var(--scene-y) * -0.14), 0) scale(1.07);
      filter: saturate(1.07) contrast(1.04);
    }

    .sunwash {
      z-index: 1;
      mix-blend-mode: screen;
      opacity: 0.84;
      background:
        radial-gradient(circle at 25% 15%, rgba(255, 228, 156, 0.58), rgba(255, 228, 156, 0.16) 18rem, transparent 36rem),
        linear-gradient(180deg, rgba(167, 220, 236, 0.10), transparent 48%);
    }

    .clouds {
      z-index: 2;
      opacity: 0.88;
      filter: blur(9px);
      mix-blend-mode: screen;
      background:
        radial-gradient(ellipse at 2% 72%, rgba(255, 255, 255, 0.86), transparent 18rem),
        radial-gradient(ellipse at 28% 92%, rgba(255, 255, 255, 0.78), transparent 24rem),
        radial-gradient(ellipse at 66% 82%, rgba(224, 248, 255, 0.76), transparent 22rem),
        radial-gradient(ellipse at 103% 76%, rgba(255, 255, 255, 0.70), transparent 18rem);
      animation: cloudDrift 16s ease-in-out infinite alternate;
    }

    .mist {
      z-index: 3;
      opacity: 0.66;
      filter: blur(18px);
      mix-blend-mode: screen;
      background:
        linear-gradient(112deg, transparent 0 16%, rgba(236, 255, 255, 0.34) 30%, transparent 44% 100%),
        linear-gradient(100deg, transparent 0 47%, rgba(191, 238, 248, 0.24) 59%, transparent 74% 100%),
        radial-gradient(ellipse at 52% 60%, rgba(234, 255, 255, 0.38), transparent 25rem);
      animation: mistBreathe 9s ease-in-out infinite;
    }

    .foreground-clouds {
      z-index: 7;
      opacity: 0.54;
      filter: blur(6px);
      mix-blend-mode: screen;
      background:
        radial-gradient(ellipse at -4% 88%, rgba(255, 255, 255, 0.86), transparent 18rem),
        radial-gradient(ellipse at 32% 104%, rgba(224, 248, 255, 0.78), transparent 20rem),
        radial-gradient(ellipse at 75% 101%, rgba(255, 255, 255, 0.80), transparent 20rem),
        radial-gradient(ellipse at 108% 89%, rgba(225, 250, 255, 0.76), transparent 16rem);
      animation: foregroundCloudRush 12s ease-in-out infinite alternate;
    }

    .drift-clouds {
      z-index: 4;
      opacity: 0.64;
      filter: blur(7px);
      mix-blend-mode: screen;
    }

    .drift-clouds::before,
    .drift-clouds::after {
      content: "";
      position: absolute;
      left: -18%;
      width: 136%;
      height: 34%;
      background-repeat: repeat-x;
      background-size: 42rem 100%;
      will-change: transform;
    }

    .drift-clouds::before {
      top: 19%;
      opacity: 0.48;
      background-image:
        radial-gradient(ellipse at 8% 56%, rgba(255, 255, 255, 0.46), transparent 8rem),
        radial-gradient(ellipse at 22% 46%, rgba(224, 248, 255, 0.36), transparent 9rem),
        radial-gradient(ellipse at 42% 58%, rgba(255, 255, 255, 0.32), transparent 8rem),
        radial-gradient(ellipse at 66% 48%, rgba(230, 250, 255, 0.34), transparent 10rem),
        radial-gradient(ellipse at 86% 58%, rgba(255, 255, 255, 0.30), transparent 8rem);
      animation: highCloudDrift 44s linear infinite;
    }

    .drift-clouds::after {
      top: 61%;
      opacity: 0.68;
      background-size: 52rem 100%;
      background-image:
        radial-gradient(ellipse at 6% 62%, rgba(255, 255, 255, 0.68), transparent 10rem),
        radial-gradient(ellipse at 24% 54%, rgba(224, 248, 255, 0.56), transparent 12rem),
        radial-gradient(ellipse at 48% 66%, rgba(255, 255, 255, 0.52), transparent 10rem),
        radial-gradient(ellipse at 72% 56%, rgba(230, 250, 255, 0.54), transparent 13rem),
        radial-gradient(ellipse at 94% 64%, rgba(255, 255, 255, 0.46), transparent 9rem);
      animation: lowCloudDrift 28s linear infinite;
    }

    .birds {
      z-index: 5;
      transform: translate3d(calc(var(--scene-x) * -0.86), calc(var(--scene-y) * -0.44), 0);
    }

    .bird {
      position: absolute;
      left: var(--bird-x);
      top: var(--bird-y);
      width: var(--bird-size);
      height: calc(var(--bird-size) * 0.42);
      opacity: var(--bird-opacity);
      animation: birdRecede var(--bird-speed) cubic-bezier(0.34, 0.02, 0.72, 1) infinite;
      animation-delay: var(--bird-delay);
    }

    .bird::before,
    .bird::after {
      content: "";
      position: absolute;
      top: 45%;
      width: 56%;
      height: 44%;
      border-top: 3px solid rgba(255, 255, 255, 0.96);
      filter:
        drop-shadow(0 0 4px rgba(8, 25, 31, 0.55))
        drop-shadow(0 0 8px rgba(82, 158, 178, 0.48));
      transform-origin: 100% 50%;
      animation-delay: var(--bird-delay);
    }

    .bird::before {
      left: 0;
      border-radius: 100% 0 0 0;
      animation: leftWingFlap 780ms ease-in-out infinite;
    }

    .bird::after {
      right: 0;
      border-radius: 0 100% 0 0;
      transform-origin: 0 50%;
      animation: rightWingFlap 780ms ease-in-out infinite;
    }

    .motes {
      z-index: 8;
      mix-blend-mode: screen;
    }

    .mote {
      position: absolute;
      left: var(--mote-x);
      top: var(--mote-y);
      width: var(--mote-size);
      height: var(--mote-size);
      border-radius: 50%;
      background: rgba(113, 240, 255, 0.92);
      box-shadow:
        0 0 8px rgba(113, 240, 255, 0.88),
        0 0 22px rgba(113, 240, 255, 0.36);
      opacity: 0;
      animation: moteRise var(--mote-speed) ease-in-out infinite;
      animation-delay: var(--mote-delay);
    }

    .portal-content {
      width: min(720px, calc(100% - 2rem));
      display: grid;
      justify-items: center;
      gap: 1.1rem;
      padding: 8vh 0;
      text-align: center;
      position: relative;
    }

    .title-stack {
      display: grid;
      justify-items: center;
      gap: 1rem;
      transform: translateY(4.8rem);
      opacity: 0;
      animation: titleRevealRise 2800ms cubic-bezier(0.2, 0.82, 0.22, 1) 220ms both;
    }

    .seal {
      display: grid;
      place-items: center;
      width: 4rem;
      height: 4rem;
      border: 2px solid rgba(243, 214, 138, 0.82);
      background:
        radial-gradient(circle, rgba(255, 246, 220, 0.18), transparent 58%),
        rgba(8, 26, 28, 0.42);
      color: var(--gold);
      font-family: var(--serif);
      font-size: 2rem;
      font-weight: 900;
      box-shadow:
        0 0 22px rgba(243, 214, 138, 0.22),
        inset 0 0 18px rgba(243, 214, 138, 0.14);
      animation: sealGlow 4.8s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      color: var(--paper);
      font-family: var(--serif);
      font-size: clamp(3.2rem, 9vw, 7.4rem);
      line-height: 0.94;
      letter-spacing: 0;
      text-shadow:
        0 0 18px rgba(22, 68, 72, 0.82),
        0 4px 0 rgba(14, 23, 20, 0.28);
    }

    .universe-tagline {
      margin: -0.45rem 0 0;
      color: rgba(255, 246, 220, 0.88);
      font: 800 clamp(0.82rem, 1.8vw, 1.05rem) var(--body);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-shadow:
        0 2px 12px rgba(0, 0, 0, 0.55),
        0 0 14px rgba(123, 216, 196, 0.24);
    }

    .portal-actions {
      width: min(25rem, 100%);
      display: grid;
      gap: 0.7rem;
      margin-top: 1.2rem;
      opacity: 0;
      transform: translateY(1.1rem);
      animation: actionsFade 760ms ease-out 2250ms both;
    }

    .portal-button {
      position: relative;
      min-height: 3.75rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(243, 214, 138, 0.52);
      color: var(--paper);
      background:
        linear-gradient(90deg, rgba(243, 214, 138, 0.10), rgba(123, 216, 196, 0.13), rgba(243, 214, 138, 0.10)),
        rgba(5, 22, 25, 0.48);
      box-shadow:
        0 14px 34px rgba(0, 0, 0, 0.24),
        inset 0 0 0 1px rgba(255, 246, 220, 0.08);
      font-family: var(--serif);
      font-size: 1.08rem;
      font-weight: 800;
      text-decoration: none;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(10px);
      opacity: 0;
      transform: translateY(0.9rem);
      animation: buttonFade 720ms ease-out both;
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .portal-button span {
      position: relative;
      z-index: 1;
      transition: transform 180ms ease;
    }

    .portal-button:nth-child(1) { animation-delay: 2450ms; }
    .portal-button:nth-child(2) { animation-delay: 2620ms; }
    .portal-button:nth-child(3) { animation-delay: 2790ms; }

    .portal-button::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent, rgba(255, 255, 255, 0.24), transparent);
      transform: translateX(-120%);
      transition: transform 520ms ease;
    }

    .portal-button::after {
      content: attr(data-description);
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      min-height: 1.45rem;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.18rem 0.85rem 0.22rem;
      color: rgba(255, 246, 220, 0.88);
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0), rgba(5, 16, 18, 0.84) 18%, rgba(5, 16, 18, 0.88) 82%, rgba(0, 0, 0, 0)),
        rgba(2, 10, 12, 0.62);
      font-family: var(--body);
      font-size: 0.72rem;
      font-weight: 600;
      line-height: 1.1;
      opacity: 0;
      transform: translateY(100%);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .portal-button:hover,
    .portal-button:focus-visible {
      outline: none;
      transform: translateY(-0.12rem);
      border-color: rgba(255, 238, 178, 0.9);
      background:
        linear-gradient(90deg, rgba(243, 214, 138, 0.18), rgba(123, 216, 196, 0.20), rgba(243, 214, 138, 0.18)),
        rgba(7, 31, 35, 0.58);
      box-shadow:
        0 20px 44px rgba(0, 0, 0, 0.32),
        0 0 26px rgba(123, 216, 196, 0.22),
        inset 0 0 0 1px rgba(255, 246, 220, 0.14);
    }

    .portal-button:hover::before,
    .portal-button:focus-visible::before {
      transform: translateX(120%);
    }

    .portal-button:hover span,
    .portal-button:focus-visible span {
      transform: translateY(-0.48rem);
    }

    .portal-button:hover::after,
    .portal-button:focus-visible::after {
      opacity: 1;
      transform: translateY(0);
    }

    .portal-button.primary {
      border-color: rgba(243, 214, 138, 0.78);
      background:
        linear-gradient(90deg, rgba(137, 75, 24, 0.52), rgba(31, 108, 98, 0.42), rgba(137, 75, 24, 0.52)),
        rgba(7, 24, 26, 0.62);
    }

    .portal-button.locked {
      border-color: rgba(210, 218, 215, 0.30);
      color: rgba(232, 238, 235, 0.54);
      background:
        linear-gradient(90deg, rgba(180, 189, 185, 0.10), rgba(82, 98, 99, 0.13), rgba(180, 189, 185, 0.10)),
        rgba(7, 18, 20, 0.54);
      box-shadow:
        0 10px 26px rgba(0, 0, 0, 0.20),
        inset 0 0 0 1px rgba(255, 255, 255, 0.045);
      cursor: not-allowed;
      filter: grayscale(0.55) saturate(0.55);
    }

    .portal-button.locked::after {
      color: rgba(232, 238, 235, 0.72);
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0), rgba(7, 13, 14, 0.82) 18%, rgba(7, 13, 14, 0.88) 82%, rgba(0, 0, 0, 0)),
        rgba(2, 8, 10, 0.64);
    }

    .soon-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 1.15rem;
      margin-left: 0.55rem;
      padding: 0.08rem 0.4rem;
      border: 1px solid rgba(232, 238, 235, 0.28);
      color: rgba(232, 238, 235, 0.62);
      font-family: var(--body);
      font-size: 0.62rem;
      line-height: 1;
      text-transform: uppercase;
      vertical-align: middle;
    }

    .soon-badge.standalone {
      min-height: 1.4rem;
      margin-left: 0;
      padding: 0.14rem 0.7rem;
    }

    .portal-button.locked:hover,
    .portal-button.locked:focus-visible {
      border-color: rgba(210, 218, 215, 0.42);
      background:
        linear-gradient(90deg, rgba(180, 189, 185, 0.14), rgba(82, 98, 99, 0.18), rgba(180, 189, 185, 0.14)),
        rgba(7, 18, 20, 0.62);
      box-shadow:
        0 14px 30px rgba(0, 0, 0, 0.25),
        inset 0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    @keyframes titleRevealRise {
      0% {
        opacity: 0;
        transform: translateY(4.8rem) scale(0.96);
      }

      38% {
        opacity: 1;
        transform: translateY(4.8rem) scale(1);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes actionsFade {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes buttonFade {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes sealGlow {
      0%,
      100% {
        box-shadow:
          0 0 22px rgba(243, 214, 138, 0.22),
          inset 0 0 18px rgba(243, 214, 138, 0.14);
      }

      50% {
        box-shadow:
          0 0 34px rgba(123, 216, 196, 0.34),
          inset 0 0 26px rgba(243, 214, 138, 0.22);
      }
    }

    @keyframes cloudDrift {
      from {
        transform: translate3d(calc(var(--scene-x) * -0.62 - 4rem), calc(var(--scene-y) * -0.35 + 0.4rem), 0);
      }

      to {
        transform: translate3d(calc(var(--scene-x) * -0.62 + 5rem), calc(var(--scene-y) * -0.35 - 0.8rem), 0);
      }
    }

    @keyframes foregroundCloudRush {
      from {
        transform: translate3d(calc(var(--scene-x) * -0.92 - 6rem), calc(var(--scene-y) * -0.48 + 0.8rem), 0) scale(1.02);
      }

      to {
        transform: translate3d(calc(var(--scene-x) * -0.92 + 7rem), calc(var(--scene-y) * -0.48 - 0.5rem), 0) scale(1.08);
      }
    }

    @keyframes highCloudDrift {
      from {
        transform: translate3d(calc(var(--scene-x) * -0.36), calc(var(--scene-y) * -0.18), 0);
      }

      to {
        transform: translate3d(calc(var(--scene-x) * -0.36 - 42rem), calc(var(--scene-y) * -0.18), 0);
      }
    }

    @keyframes lowCloudDrift {
      from {
        transform: translate3d(calc(var(--scene-x) * -0.74), calc(var(--scene-y) * -0.36), 0);
      }

      to {
        transform: translate3d(calc(var(--scene-x) * -0.74 + 52rem), calc(var(--scene-y) * -0.36), 0);
      }
    }

    @keyframes mistBreathe {
      0%,
      100% {
        opacity: 0.38;
        transform: translate3d(calc(var(--scene-x) * -0.42 - 0.8rem), calc(var(--scene-y) * -0.22), 0) scale(1);
      }

      50% {
        opacity: 0.58;
        transform: translate3d(calc(var(--scene-x) * -0.42 + 0.8rem), calc(var(--scene-y) * -0.22 - 0.5rem), 0) scale(1.025);
      }
    }

    @keyframes birdRecede {
      0% {
        opacity: 0;
        transform: translate3d(0, 0, 0) scale(var(--bird-start-scale, 1.18));
      }

      8% {
        opacity: 0;
      }

      18% {
        opacity: var(--bird-opacity);
      }

      72% {
        opacity: calc(var(--bird-opacity) * 0.72);
      }

      100% {
        opacity: 0;
        transform: translate3d(var(--bird-dx), var(--bird-dy), 0) scale(var(--bird-end-scale, 0.18));
      }
    }

    @keyframes leftWingFlap {
      0%,
      100% {
        transform: rotate(22deg) translateY(0);
      }

      50% {
        transform: rotate(-13deg) translateY(0.08rem);
      }
    }

    @keyframes rightWingFlap {
      0%,
      100% {
        transform: rotate(-22deg) translateY(0);
      }

      50% {
        transform: rotate(13deg) translateY(0.08rem);
      }
    }

    @keyframes moteRise {
      0% {
        opacity: 0;
        transform: translate3d(0, 1.8rem, 0) scale(0.6);
      }

      20%,
      72% {
        opacity: 0.78;
      }

      100% {
        opacity: 0;
        transform: translate3d(0.9rem, -5.5rem, 0) scale(1.1);
      }
    }

    @media (max-width: 640px) {
      .language-switch {
        top: 0.7rem;
        right: 0.7rem;
      }

      .language-switch button {
        min-width: 2.55rem;
        min-height: 2.05rem;
        font-size: 0.72rem;
      }

      .portal-content {
        padding: 5vh 0;
      }

      .portal-actions {
        width: min(21rem, 100%);
      }

      .portal-button {
        min-height: 3.95rem;
      }

      .portal-button::after {
        font-size: 0.66rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

      .portal {
        --scene-x: 0px !important;
        --scene-y: 0px !important;
      }
    }
  </style>
</head>
<body>
  <main class="portal">
    <div class="language-switch" aria-label="Language selector">
      <button type="button" class="active" data-lang="en">EN</button>

  <script>
    const splashTranslations = {
      en: {
        pageTitle: "Nine Realms - Portal",
        universeTagline: "A Xianxia Universe",
        pathButton: "Path of the Dao",
        comingSoon: "Coming Soon",
        pathDescription: "Nine Realms: Path of the Dao - An Elin mod",
        secondDescription: "A free browser based Idle Cultivator game based in the Nine Realms Xianxia Universe",
        thirdDescription: "Another portal will awaken in a later release."
      },
      ja: {
        pageTitle: "Nine Realms - 入口",
        universeTagline: "仙侠の世界",
        pathButton: "Dao の道",
        comingSoon: "近日公開",
        pathDescription: "Nine Realms: Path of the Dao - Elin Mod",
        secondDescription: "Nine Realms の仙侠世界を舞台にした無料ブラウザ向け Idle Cultivator ゲーム。",
        thirdDescription: "別の入口は今後のリリースで目覚めます。"
      },
      zh: {
        pageTitle: "Nine Realms - 入口",
        universeTagline: "一个仙侠宇宙",
        pathButton: "道途",
        comingSoon: "即将开放",
        pathDescription: "Nine Realms: Path of the Dao - Elin 模组",
        secondDescription: "一款以 Nine Realms 仙侠宇宙为背景的免费浏览器 Idle Cultivator 游戏。",
        thirdDescription: "另一座入口将在之后的版本中觉醒。"
      }
    };

    const languageButtons = [...document.querySelectorAll("[data-lang]")];
    const portalButtons = [...document.querySelectorAll(".portal-button")];

    function applySplashLanguage(lang) {
      const dict = splashTranslations[lang] || splashTranslations.en;
      document.documentElement.lang = lang;
      document.title = dict.pageTitle;
      document.querySelectorAll("[data-i18n]").forEach((node) => {
        const key = node.dataset.i18n;
        if (dict[key]) node.textContent = dict[key];
      });
      if (portalButtons[0]) portalButtons[0].dataset.description = dict.pathDescription;
      if (portalButtons[1]) portalButtons[1].dataset.description = dict.secondDescription;
      if (portalButtons[2]) portalButtons[2].dataset.description = dict.thirdDescription;
      languageButtons.forEach((button) => button.classList.toggle("active", button.dataset.lang === lang));
      try {
        window.localStorage.setItem("nine-realms-lang", lang);
      } catch (error) {
        document.documentElement.dataset.language = lang;
      }
    }

    languageButtons.forEach((button) => {
      button.addEventListener("click", () => applySplashLanguage(button.dataset.lang));
    });

    let savedLanguage = "en";
    try {
      savedLanguage = window.localStorage.getItem("nine-realms-lang") || "en";
    } catch (error) {
      savedLanguage = "en";
    }
    applySplashLanguage(splashTranslations[savedLanguage] ? savedLanguage : "en");

    const portal = document.querySelector(".portal");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    if (portal && !reduceMotion) {
      let targetX = 0;
      let targetY = 0;
      let currentX = 0;
      let currentY = 0;

      function setTarget(clientX, clientY) {
        targetX = ((clientX / window.innerWidth) - 0.5) * 22;
        targetY = ((clientY / window.innerHeight) - 0.5) * 16;
      }

      function animate() {
        currentX += (targetX - currentX) * 0.045;
        currentY += (targetY - currentY) * 0.045;
        portal.style.setProperty("--scene-x", `${currentX.toFixed(2)}px`);
        portal.style.setProperty("--scene-y", `${currentY.toFixed(2)}px`);
        window.requestAnimationFrame(animate);
      }

      window.addEventListener("pointermove", (event) => setTarget(event.clientX, event.clientY), { passive: true });
      window.addEventListener("pointerleave", () => {
        targetX = 0;
        targetY = 0;
      });
      animate();
    }
  </script>
